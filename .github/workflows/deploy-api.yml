name: Deploy Laravel API

on:
  push:
    branches:
      - main
    paths:
      - 'api_namiroh/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_mysql

      - name: Install Composer dependencies
        working-directory: ./api_namiroh  # ← fix
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Sync files via rsync over SSH
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            ./api_namiroh/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/u190975834/domains/annamirohtravelindo.com/public_html/api/

      - name: Run Laravel post-deploy commands
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd /home/u190975834/domains/annamirohtravelindo.com/public_html/api && \
             php artisan config:cache && \
             php artisan route:cache && \
             php artisan migrate --force && \
             ln -sfn /home/u190975834/domains/annamirohtravelindo.com/public_html/api/storage/app/public \
             /home/u190975834/domains/annamirohtravelindo.com/public_html/api/public/storage"