name: Deploy API to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'api_namiroh/**'
      - 'scripts/deploy_hostinger_subdomain.sh'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy API via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          ENV_APP_KEY: ${{ secrets.API_APP_KEY }}
          ENV_APP_URL: ${{ secrets.API_APP_URL }}
          ENV_FRONTEND_URL: ${{ secrets.API_FRONTEND_URL }}
          ENV_DB_HOST: ${{ secrets.API_DB_HOST }}
          ENV_DB_PORT: ${{ secrets.API_DB_PORT }}
          ENV_DB_DATABASE: ${{ secrets.API_DB_DATABASE }}
          ENV_DB_USERNAME: ${{ secrets.API_DB_USERNAME }}
          ENV_DB_PASSWORD: ${{ secrets.API_DB_PASSWORD }}
          ENV_API_DOMAIN: ${{ secrets.API_DOMAIN }}
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: 65002
          timeout: 300s
          command_timeout: 30m
          script_stop: true
          envs: ENV_APP_KEY,ENV_APP_URL,ENV_FRONTEND_URL,ENV_DB_HOST,ENV_DB_PORT,ENV_DB_DATABASE,ENV_DB_USERNAME,ENV_DB_PASSWORD,ENV_API_DOMAIN
          script: |
            set -euo pipefail

            REPO_DIR="$HOME/namiroh_pusat_web"
            REPO_URL="https://github.com/sabiliwafa29/namiroh_pusat_web.git"
            API_DIR="$REPO_DIR/api_namiroh"
            API_DOMAIN="${ENV_API_DOMAIN:-api.annamirohtravelindo.com}"
            API_PUBLIC="$HOME/domains/$API_DOMAIN/public_html"
            API_RUNTIME="$HOME/domains/$API_DOMAIN/api_app"

            sync_dir() {
              local src="$1"
              local dst="$2"
              mkdir -p "$dst"
              if command -v rsync >/dev/null 2>&1; then
                rsync -a --delete "$src" "$dst"
              else
                find "$dst" -mindepth 1 -exec rm -rf {} +
                cp -a "$src". "$dst"/
              fi
            }

            echo "=== Update repository ==="
            if [ -d "$REPO_DIR/.git" ]; then
              cd "$REPO_DIR"
              git fetch origin main
              git reset --hard origin/main
            else
              if [ -d "$REPO_DIR" ]; then
                rm -rf "$REPO_DIR"
              fi
              git clone "$REPO_URL" "$REPO_DIR"
            fi

            echo "=== Validate runtime dependencies ==="
            command -v php >/dev/null 2>&1 || { echo "php is required"; exit 1; }
            command -v composer >/dev/null 2>&1 || { echo "composer is required"; exit 1; }

            mkdir -p "$API_PUBLIC"
            echo "API_PUBLIC=$API_PUBLIC"

            echo "=== Validate required secrets ==="
            missing_secrets=""

            require_secret() {
              local app_key_name="$1"
              local github_secret_name="$2"
              local value="$3"
              local trimmed

              # Remove common whitespace so accidental spaces/newlines count as empty.
              trimmed="$(printf '%s' "$value" | tr -d '[:space:]')"

              if [ -z "$trimmed" ]; then
                echo "MISSING: $github_secret_name (mapped as $app_key_name)"
                missing_secrets="${missing_secrets}${github_secret_name}\n"
              else
                echo "OK: $github_secret_name"
              fi
            }

            require_secret APP_KEY API_APP_KEY "${ENV_APP_KEY-}"
            require_secret APP_URL API_APP_URL "${ENV_APP_URL-}"
            require_secret FRONTEND_URL API_FRONTEND_URL "${ENV_FRONTEND_URL-}"
            require_secret DB_HOST API_DB_HOST "${ENV_DB_HOST-}"
            require_secret DB_PORT API_DB_PORT "${ENV_DB_PORT-}"
            require_secret DB_DATABASE API_DB_DATABASE "${ENV_DB_DATABASE-}"
            require_secret DB_USERNAME API_DB_USERNAME "${ENV_DB_USERNAME-}"
            require_secret DB_PASSWORD API_DB_PASSWORD "${ENV_DB_PASSWORD-}"

            if [ -n "$missing_secrets" ]; then
              echo ""
              echo "Required GitHub Secrets yang belum terisi:" 
              printf "%b" "$missing_secrets"
              exit 1
            fi

            # Normalize secrets to avoid hidden CR/LF causing auth failures.
            DB_HOST="$(printf '%s' "${ENV_DB_HOST}" | tr -d '\r\n')"
            DB_PORT="$(printf '%s' "${ENV_DB_PORT}" | tr -d '\r\n')"
            DB_DATABASE="$(printf '%s' "${ENV_DB_DATABASE}" | tr -d '\r\n')"
            DB_USERNAME="$(printf '%s' "${ENV_DB_USERNAME}" | tr -d '\r\n')"
            DB_PASSWORD="$(printf '%s' "${ENV_DB_PASSWORD}" | tr -d '\r\n')"

            escape_env_value() {
              printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g'
            }

            DB_HOST_ENV="$(escape_env_value "$DB_HOST")"
            DB_PORT_ENV="$(escape_env_value "$DB_PORT")"
            DB_DATABASE_ENV="$(escape_env_value "$DB_DATABASE")"
            DB_USERNAME_ENV="$(escape_env_value "$DB_USERNAME")"
            DB_PASSWORD_ENV="$(escape_env_value "$DB_PASSWORD")"

            test_db_host() {
              local host_candidate="$1"

              if ! command -v mysql >/dev/null 2>&1; then
                return 1
              fi

              mysql \
                --host="$host_candidate" \
                --port="$DB_PORT" \
                --user="$DB_USERNAME" \
                --password="$DB_PASSWORD" \
                --connect-timeout=10 \
                --execute="SELECT 1;" \
                "$DB_DATABASE" >/dev/null 2>&1
            }

            RESOLVED_DB_HOST="$DB_HOST"
            if ! test_db_host "$RESOLVED_DB_HOST"; then
              if [ "$RESOLVED_DB_HOST" = "localhost" ]; then
                ALT_DB_HOST="127.0.0.1"
              elif [ "$RESOLVED_DB_HOST" = "127.0.0.1" ]; then
                ALT_DB_HOST="localhost"
              else
                ALT_DB_HOST=""
              fi

              if [ -n "$ALT_DB_HOST" ] && test_db_host "$ALT_DB_HOST"; then
                RESOLVED_DB_HOST="$ALT_DB_HOST"
                echo "DB host fallback aktif: menggunakan $RESOLVED_DB_HOST"
              fi
            fi

            RESOLVED_DB_HOST_ENV="$(escape_env_value "$RESOLVED_DB_HOST")"

            echo "=== Inject environment values ==="
            printf '%s\n' \
              "APP_NAME=AnNamiroh" \
              "APP_ENV=production" \
              "APP_KEY=${ENV_APP_KEY}" \
              "APP_DEBUG=false" \
              "APP_URL=${ENV_APP_URL}" \
              "" \
              "FRONTEND_URL=${ENV_FRONTEND_URL}" \
              "" \
              "APP_LOCALE=id" \
              "APP_FALLBACK_LOCALE=id" \
              "APP_FAKER_LOCALE=id_ID" \
              "" \
              "APP_MAINTENANCE_DRIVER=file" \
              "" \
              "BCRYPT_ROUNDS=12" \
              "" \
              "LOG_CHANNEL=stack" \
              "LOG_STACK=single" \
              "LOG_DEPRECATIONS_CHANNEL=null" \
              "LOG_LEVEL=error" \
              "" \
              "DB_CONNECTION=mysql" \
              "DB_HOST=\"${RESOLVED_DB_HOST_ENV}\"" \
              "DB_PORT=\"${DB_PORT_ENV}\"" \
              "DB_DATABASE=\"${DB_DATABASE_ENV}\"" \
              "DB_USERNAME=\"${DB_USERNAME_ENV}\"" \
              "DB_PASSWORD=\"${DB_PASSWORD_ENV}\"" \
              "" \
              "SESSION_DRIVER=database" \
              "SESSION_LIFETIME=120" \
              "SESSION_ENCRYPT=false" \
              "SESSION_PATH=/" \
              "SESSION_DOMAIN=.annamirohtravelindo.com" \
              "" \
              "BROADCAST_CONNECTION=log" \
              "FILESYSTEM_DISK=public" \
              "QUEUE_CONNECTION=database" \
              "" \
              "CACHE_STORE=database" \
              "" \
              "MEMCACHED_HOST=127.0.0.1" \
              "" \
              "REDIS_CLIENT=phpredis" \
              "REDIS_HOST=127.0.0.1" \
              "REDIS_PASSWORD=null" \
              "REDIS_PORT=6379" \
              "" \
              "MAIL_MAILER=log" \
              "MAIL_SCHEME=null" \
              "MAIL_HOST=127.0.0.1" \
              "MAIL_PORT=2525" \
              "MAIL_USERNAME=null" \
              "MAIL_PASSWORD=null" \
              'MAIL_FROM_ADDRESS="hello@annamirohtravelindo.com"' \
              'MAIL_FROM_NAME="${APP_NAME}"' \
              "" \
              "AWS_ACCESS_KEY_ID=" \
              "AWS_SECRET_ACCESS_KEY=" \
              "AWS_DEFAULT_REGION=us-east-1" \
              "AWS_BUCKET=" \
              "AWS_USE_PATH_STYLE_ENDPOINT=false" \
              "" \
              'VITE_APP_NAME="${APP_NAME}"' \
              > "$API_DIR/.env"

            echo "Environment file written successfully"
            if grep -P '^\s+\S' "$API_DIR/.env" >/dev/null 2>&1; then
              echo "ERROR: .env has lines with leading whitespace — aborting"
              exit 1
            fi

            echo "=== Install Laravel dependencies ==="
            cd "$API_DIR"
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "=== Preflight DB connection ==="
            echo "DB_HOST_SECRET=${DB_HOST}"
            echo "DB_HOST_RESOLVED=${RESOLVED_DB_HOST}"
            echo "DB_PORT=${DB_PORT}"
            echo "DB_DATABASE=${DB_DATABASE}"
            echo "DB_USERNAME=${DB_USERNAME}"
            echo "DB_PASSWORD_LENGTH=${#DB_PASSWORD}"

            DB_PREFLIGHT_OK=0
            set +e

            if command -v mysql >/dev/null 2>&1; then
              if DB_CHECK=$(mysql \
                --host="${RESOLVED_DB_HOST}" \
                --port="${DB_PORT}" \
                --user="${DB_USERNAME}" \
                --password="${DB_PASSWORD}" \
                --connect-timeout=10 \
                --execute="SELECT 'DB_OK' AS status;" \
                "${DB_DATABASE}" 2>&1); then
                DB_CHECK_EXIT=0
              else
                DB_CHECK_EXIT=$?
              fi

              echo "mysql preflight exit_code=$DB_CHECK_EXIT"
              echo "$DB_CHECK"

              if [ "$DB_CHECK_EXIT" -eq 0 ] && echo "$DB_CHECK" | grep -q "DB_OK"; then
                DB_PREFLIGHT_OK=1
              fi
            else
              echo "mysql client not found on server, skipping mysql preflight"
            fi

            if [ "$DB_PREFLIGHT_OK" -ne 1 ]; then
              if PHP_DB_CHECK=$(RESOLVED_DB_HOST="$RESOLVED_DB_HOST" DB_PORT="$DB_PORT" DB_DATABASE="$DB_DATABASE" DB_USERNAME="$DB_USERNAME" DB_PASSWORD="$DB_PASSWORD" php -r '
                $h = getenv("RESOLVED_DB_HOST");
                $p = getenv("DB_PORT") ?: "3306";
                $d = getenv("DB_DATABASE");
                $u = getenv("DB_USERNAME");
                $pw = getenv("DB_PASSWORD");
                try {
                  $pdo = new PDO("mysql:host={$h};port={$p};dbname={$d}", $u, $pw, [PDO::ATTR_TIMEOUT => 10]);
                  $pdo->query("SELECT 1");
                  echo "DB_OK";
                } catch (Throwable $e) {
                  echo "DB_FAIL: " . $e->getMessage();
                  exit(1);
                }
              ' 2>&1); then
                PHP_DB_CHECK_EXIT=0
              else
                PHP_DB_CHECK_EXIT=$?
              fi

              echo "php-pdo preflight exit_code=$PHP_DB_CHECK_EXIT"
              echo "$PHP_DB_CHECK"

              if [ "$PHP_DB_CHECK_EXIT" -eq 0 ] && echo "$PHP_DB_CHECK" | grep -q "DB_OK"; then
                DB_PREFLIGHT_OK=1
              fi
            fi

            set -e

            if [ "$DB_PREFLIGHT_OK" -eq 1 ]; then
              echo "DB preflight OK"
            else
              echo "DB preflight FAILED"
              echo "Periksa GitHub Secrets API_DB_*:"
              echo "1) API_DB_HOST sesuai host MySQL di hPanel (sering localhost/127.0.0.1)"
              echo "2) API_DB_DATABASE pakai prefix akun"
              echo "3) API_DB_USERNAME pakai prefix akun"
              echo "4) User database di-assign ke database dengan privilege"
              echo "5) API_DB_PASSWORD adalah password user database"
              exit 1
            fi

            echo "=== Run migrations and cache ==="
            php artisan optimize:clear
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "=== Prepare API runtime in domains directory ==="
            sync_dir "$API_DIR/" "$API_RUNTIME/"

            mkdir -p "$API_RUNTIME/storage" "$API_RUNTIME/bootstrap/cache"
            chmod -R 775 "$API_RUNTIME/storage" "$API_RUNTIME/bootstrap/cache" || true

            echo "=== Create storage symlink ==="
            STORAGE_LINK="$API_RUNTIME/public/storage"
            STORAGE_TARGET="$API_RUNTIME/storage/app/public"
            if [ -e "$STORAGE_LINK" ] && [ ! -L "$STORAGE_LINK" ]; then
              rm -rf "$STORAGE_LINK"
            fi
            ln -sfn "$STORAGE_TARGET" "$STORAGE_LINK"
            echo "  Symlink set: $STORAGE_LINK -> $STORAGE_TARGET"

            echo "=== Publish API public files to $API_PUBLIC ==="
            sync_dir "$API_RUNTIME/public/" "$API_PUBLIC/"

            echo "=== Patch API front controller at $API_PUBLIC ==="
            # Tidak ada indentasi di dalam heredoc agar index.php bersih tanpa leading whitespace
            cat > "$API_PUBLIC/index.php" <<PHP
            <?php

            use Illuminate\Contracts\Http\Kernel;
            use Illuminate\Http\Request;

            define('LARAVEL_START', microtime(true));

            if (file_exists(
                \$maintenance = '${API_RUNTIME}/storage/framework/maintenance.php'
            )) {
                require \$maintenance;
            }

            require '${API_RUNTIME}/vendor/autoload.php';

            \$app = require_once '${API_RUNTIME}/bootstrap/app.php';

            \$kernel = \$app->make(Kernel::class);

            \$response = \$kernel->handle(
                \$request = Request::capture()
            )->send();

            \$kernel->terminate(\$request, \$response);
            PHP

            chmod 755 "$API_PUBLIC"
            find "$API_PUBLIC" -type d -exec chmod 755 {} \;
            find "$API_PUBLIC" -type f -exec chmod 644 {} \;

            echo "=== Post-deploy checks ==="
            if command -v curl >/dev/null 2>&1; then
              PAKET_URL="https://$API_DOMAIN/api/paket?page=1&per_page=1"
              PAKET_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "$PAKET_URL" || true)
              echo "GET $PAKET_URL -> $PAKET_STATUS"

              if [ "$PAKET_STATUS" -ge 500 ] 2>/dev/null; then
                echo "=== API diagnostics (5xx detected) ==="
                if [ -f "$API_RUNTIME/storage/logs/laravel.log" ]; then
                  tail -n 120 "$API_RUNTIME/storage/logs/laravel.log" || true
                else
                  echo "laravel.log not found at $API_RUNTIME/storage/logs/laravel.log"
                fi
                exit 1
              fi
            else
              echo "curl not found; skipping HTTP checks"
            fi

            echo "=== SUCCESS ==="
            ls -lh "$API_PUBLIC/index.php"
            ls -la "$API_PUBLIC" | head -n 20
