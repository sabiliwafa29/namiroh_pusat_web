name: Deploy Dashboard to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'dashboard_namiroh/**'
      - '.github/workflows/deploy-dashboard.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '20.x'

      - name: Install dependencies
        working-directory: dashboard_namiroh
        run: npm install

      - name: Build production
        working-directory: dashboard_namiroh
        run: npm run build

      - name: Push dist to repo (commit dist)
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -f dashboard_namiroh/dist/
          git commit -m "chore: build dist for deployment" || true
          git push origin main || true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: 65002
          script_stop: true
          script: |
            set -e
            
            echo "📥 Pull latest changes from git..."
            cd ~/namiroh_pusat_web
            git pull origin main
            
            echo "🔄 Copy dist to public_html..."
            rm -rf ~/public_html/*
            cp -r ./dashboard_namiroh/dist/* ~/public_html/
            
            echo "🔧 Fixing permissions..."
            chmod -R 755 ~/public_html/
            find ~/public_html/ -type f -exec chmod 644 {} \;
            
            echo "📝 Creating .htaccess for SPA routing..."
            cat > ~/public_html/.htaccess <<'HTACCESS'
            <IfModule mod_rewrite.c>
              RewriteEngine On
              RewriteBase /
            
              RewriteRule ^index\.html$ - [L]
            
              RewriteCond %{REQUEST_FILENAME} !-f
              RewriteCond %{REQUEST_FILENAME} !-d
              RewriteRule . /index.html [L]
            </IfModule>
            HTACCESS
            
            echo "✅ Deployment complete!"
            echo ""
            echo "📂 Verifying deployment..."
            ls -la ~/public_html/ | head -15
            
            echo ""
            if [ -f ~/public_html/index.html ]; then
              echo "✔️ index.html found - deployment successful!"
            else
              echo "❌ index.html NOT found - something went wrong"
              exit 1
            fi
