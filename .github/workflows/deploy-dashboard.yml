name: Deploy Dashboard to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'dashboard_namiroh/**'
      - '.github/workflows/deploy-dashboard.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '20.x'

      - name: Install dependencies
        working-directory: dashboard_namiroh
        run: npm install

      - name: Build production
        working-directory: dashboard_namiroh
        run: npm run build

      - name: Push dist to repo (commit dist)
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -f dashboard_namiroh/dist/
          git commit -m "chore: build dist for deployment" || true
          git push origin main || true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: 65002
          script_stop: true
          script: |
            DOMAIN_ROOT="~/domains/annamirohtravelindo.com/public_html"
            
            echo "Pull latest changes..."
            cd ~/namiroh_pusat_web
            git pull origin main
            
            rm -rf $DOMAIN_ROOT
            mkdir -p $DOMAIN_ROOT
            cp -r dashboard_namiroh/dist/* $DOMAIN_ROOT/
            
            chmod 755 $DOMAIN_ROOT
            find $DOMAIN_ROOT -type f -exec chmod 644 {} \;
            find $DOMAIN_ROOT -type d -exec chmod 755 {} \;
            
            cat > $DOMAIN_ROOT/.htaccess <<'HTACCESS'
            <IfModule mod_rewrite.c>
              RewriteEngine On
              RewriteBase /
              RewriteRule ^index\.html$ - [L]
              RewriteCond %{REQUEST_FILENAME} !-f
              RewriteCond %{REQUEST_FILENAME} !-d
              RewriteRule . /index.html [L]
            </IfModule>
            HTACCESS
            
            echo "Deployment complete!"
            ls -la $DOMAIN_ROOT/index.html
            
            echo "� Debugging: Check dist folder structure..."
            echo "Contents of dashboard_namiroh/dist:"
            ls -la dashboard_namiroh/dist/ | head -20
            
            echo ""
            echo "🔄 Clean public_html and copy files..."
            rm -rf ~/public_html
            mkdir -p ~/public_html
            
            # Copy everything from dist directly (not nested)
            if [ -d "dashboard_namiroh/dist" ]; then
              cp -v dashboard_namiroh/dist/* ~/public_html/ 2>&1 | head -20 || true
              echo ""
              echo "Copying hidden files..."
              cp -v dashboard_namiroh/dist/.* ~/public_html/ 2>&1 | grep -v "^\." || true
            fi
            
            echo ""
            echo "✅ Files copied. Current public_html:"
            ls -la ~/public_html/
            
            echo ""
            echo "🔧 Fixing permissions..."
            chmod 755 ~/public_html/
            find ~/public_html/ -type f -exec chmod 644 {} \;
            find ~/public_html/ -type d -exec chmod 755 {} \;
            
            echo "📝 Creating .htaccess for SPA routing..."
            cat > ~/public_html/.htaccess <<'HTACCESS'
            <IfModule mod_rewrite.c>
              RewriteEngine On
              RewriteBase /
            
              RewriteRule ^index\.html$ - [L]
            
              RewriteCond %{REQUEST_FILENAME} !-f
              RewriteCond %{REQUEST_FILENAME} !-d
              RewriteRule . /index.html [L]
            </IfModule>
            HTACCESS
            
            echo ""
            echo "✅ Deployment complete!"
            echo ""
            if [ -f ~/public_html/index.html ]; then
              echo "✔️ SUCCESS: index.html found at $(ls -lh ~/public_html/index.html)"
            else
              echo "❌ ERROR: index.html NOT found in ~/public_html"
              echo "Directory contents:"
              ls -laR ~/public_html/ | head -50
              exit 1
            fi
