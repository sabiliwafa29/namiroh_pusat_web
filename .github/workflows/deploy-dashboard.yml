name: Deploy Dashboard to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'dashboard_namiroh/**'
      - '.github/workflows/deploy-dashboard.yml'

concurrency:
  group: deploy-dashboard-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: 65002
          script_stop: true
          script: |
            set -euo pipefail

            DOMAIN_ROOT="/home/u190975834/public_html"
            REPO_DIR="$HOME/namiroh_pusat_web"
            REPO_URL="https://github.com/sabiliwafa29/namiroh_pusat_web.git"
            NVM_DIR="$HOME/.nvm"

            ensure_node() {
              if command -v npm >/dev/null 2>&1 && command -v node >/dev/null 2>&1; then
                echo "Node/npm already available"
                node -v
                npm -v
                return 0
              fi

              echo "Node/npm not found, installing Node 20 via nvm"
              if [ ! -s "$NVM_DIR/nvm.sh" ]; then
                curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
              fi

              # shellcheck disable=SC1090
              . "$NVM_DIR/nvm.sh"
              nvm install 20
              nvm use 20

              node -v
              npm -v
            }

            echo "=== Pull latest code ==="
            echo "HOME=$HOME"
            echo "REPO_DIR=$REPO_DIR"

            if [ -d "$REPO_DIR/.git" ]; then
              cd "$REPO_DIR"
              git remote -v
              git fetch origin main
              git reset --hard origin/main
            else
              if [ -d "$REPO_DIR" ]; then
                # Existing non-git directory breaks git clone; clean and re-clone.
                rm -rf "$REPO_DIR"
              fi
              git clone "$REPO_URL" "$REPO_DIR"
            fi

            echo "=== Install & Build React ==="
            ensure_node
            cd "$REPO_DIR/dashboard_namiroh"
            npm ci
            npm run build

            echo "=== Deploy to public_html ==="
            mkdir -p "$DOMAIN_ROOT"
            # Keep .well-known if present (SSL/challenge files) and clean the rest.
            find "$DOMAIN_ROOT" -mindepth 1 ! -path "$DOMAIN_ROOT/.well-known*" -exec rm -rf {} +
            cp -r "$REPO_DIR/dashboard_namiroh/dist/." "$DOMAIN_ROOT/"

            chmod 755 "$DOMAIN_ROOT"
            find "$DOMAIN_ROOT" -type f -exec chmod 644 {} \;
            find "$DOMAIN_ROOT" -type d -exec chmod 755 {} \;

            cat > "$DOMAIN_ROOT/.htaccess" <<'HTACCESS'
            <IfModule mod_rewrite.c>
              RewriteEngine On
              RewriteBase /
              RewriteRule ^index\.html$ - [L]
              RewriteCond %{REQUEST_FILENAME} !-f
              RewriteCond %{REQUEST_FILENAME} !-d
              RewriteRule . /index.html [L]
            </IfModule>
            HTACCESS

            echo "=== SUCCESS ==="
            ls -lh "$DOMAIN_ROOT/index.html"