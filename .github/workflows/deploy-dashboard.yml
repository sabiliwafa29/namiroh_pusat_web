name: Deploy Dashboard to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'dashboard_namiroh/**'
      - '.github/workflows/deploy-dashboard.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '20.x'

      - name: Install dependencies
        working-directory: dashboard_namiroh
        run: npm install

      - name: Build production
        working-directory: dashboard_namiroh
        run: npm run build

      - name: Push dist to repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -f dashboard_namiroh/dist/
          git commit -m "chore: build dist for deployment" || true
          git push https://x-access-token:$GITHUB_TOKEN@github.com/sabiliwafa29/namiroh_pusat_web.git main || true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: 65002
          script_stop: true
          script: |
            DOMAIN_ROOT="/home/u190975834/public_html"
            REPO_DIR="$HOME/namiroh_pusat_web"

            echo "Check & clone repo if not exists..."
            if [ ! -d "$REPO_DIR/.git" ]; then
              git clone https://github.com/sabiliwafa29/namiroh_pusat_web.git $REPO_DIR
            else
              cd $REPO_DIR && git pull origin main
            fi

            echo "Check dist folder exists..."
            if [ ! -d "$REPO_DIR/dashboard_namiroh/dist" ]; then
              echo "ERROR: dist/ folder not found in repo!"
              exit 1
            fi

            echo "Deploy dist to domain..."
            rm -rf $DOMAIN_ROOT/*
            mkdir -p $DOMAIN_ROOT
            cp -r $REPO_DIR/dashboard_namiroh/dist/* $DOMAIN_ROOT/

            chmod 755 $DOMAIN_ROOT
            find $DOMAIN_ROOT -type f -exec chmod 644 {} \;
            find $DOMAIN_ROOT -type d -exec chmod 755 {} \;

            cat > $DOMAIN_ROOT/.htaccess <<'HTACCESS'
            <IfModule mod_rewrite.c>
              RewriteEngine On
              RewriteBase /
              RewriteRule ^index\.html$ - [L]
              RewriteCond %{REQUEST_FILENAME} !-f
              RewriteCond %{REQUEST_FILENAME} !-d
              RewriteRule . /index.html [L]
            </IfModule>
            HTACCESS

            echo "SUCCESS: Dashboard deployed!"
            ls -lh $DOMAIN_ROOT/index.html